name: Hostmint Prüfen

# Prüft einen Branch dieses Forks schnell, bevor er als Pull Request nach upstream geht: Lint, Typecheck und ausgewählte
# Tests mit PostgreSQL, wie in ci.yml von upstream. Für Feature-Branches gedacht, die von upstream/main abzweigen und
# diesen Workflow deshalb selbst nicht enthalten. Die vollständige Prüfung von upstream läuft danach im Pull Request.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch oder Commit"
        required: true
      tests:
        description: "Pfade für Vitest, mit Leerzeichen getrennt; leer = alle Tests"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: haben
          POSTGRES_PASSWORD: haben
          POSTGRES_DB: haben_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haben -d haben_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint
      # Zeigt, was Biome an der Formatierung anders will, damit es sich ohne Bun auf dem Rechner übernehmen lässt
      - name: Formatierung als Diff
        if: ${{ steps.lint.outcome == 'failure' }}
        run: |
          bun --bun biome format --write . > /dev/null 2>&1 || true
          git --no-pager diff --stat
          git --no-pager diff

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      # pdftoppm wie in ci.yml
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      - name: Tests
        id: tests
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgres://haben:haben@localhost:5432/haben_test
          TESTS: ${{ inputs.tests }}
        # TESTS bewusst ohne Anführungszeichen: mehrere Pfade, mit Leerzeichen getrennt
        run: bun --bun vitest run $TESTS

      - name: Ergebnis
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          echo "Lint: $LINT   Typecheck: $TYPECHECK   Tests: $TESTS"
          test "$LINT" = success && test "$TYPECHECK" = success && test "$TESTS" = success
